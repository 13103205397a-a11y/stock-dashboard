<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>A股盘面 · 研究工作台</title>
  <link rel="stylesheet" href="styles.css?v=19" />
  <link rel="stylesheet" href="design-system.css?v=10" />
  <link rel="stylesheet" href="claude-theme.css?v=14" />
</head>
<body class="density-compact">
  <a class="skip-link" href="#mainContent">跳到主要内容</a>
  <!-- 移动端汉堡按钮 -->
  <button class="menu-toggle" id="menuToggle" aria-label="菜单" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <div class="app-shell">
    <!-- ===== 左侧导航 ===== -->
    <aside class="sidebar" id="sidebar" aria-label="模块导航">
      <div class="side-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3v4M6 17v4M6 7h0M6 17h0"/><rect x="4.5" y="7" width="3" height="10" rx="0.5" fill="currentColor" stroke="none"/>
          <path d="M12 5v3M12 16v3"/><rect x="10.5" y="8" width="3" height="8" rx="0.5" fill="none"/>
          <path d="M18 4v2M18 14v4M18 6h0M18 14h0"/><rect x="16.5" y="6" width="3" height="8" rx="0.5" fill="currentColor" stroke="none"/>
        </svg>
        <div class="logo-text">
          <span class="logo-title">A股盘面</span>
          <span class="logo-sub">Research desk</span>
        </div>
      </div>

      <nav class="side-nav" aria-label="研究模块">
        <div class="nav-group">
          <button class="nav-item active" data-view="home">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
            <span>首页</span>
          </button>
        </div>
        <div class="nav-group">
          <button class="nav-item" data-view="watch">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
            <span>巨头核心</span>
          </button>
          <button class="nav-item" data-view="market">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5M4 19h16"/><path d="M8 16v-5M12 16V8M16 16v-3M20 16v-7"/></svg>
            <span>市场扫描</span>
          </button>
          <button class="nav-item" data-view="logic">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><path d="M8 6h8M6 9v3l6 3M18 9v3l-6 3"/></svg>
            <span>逻辑链</span>
          </button>
        </div>
        <div class="nav-group">
          <button class="nav-item" data-view="xbrief">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/><circle cx="17" cy="16" r="3"/><path d="M17 15v2l1.2.8"/></svg>
            <span>外围热点</span>
          </button>
          <button class="nav-item" data-view="events">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 17l4-4 4 4 4-8 4 8"/><circle cx="3" cy="17" r="1"/><circle cx="7" cy="13" r="1"/><circle cx="11" cy="17" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="19" cy="17" r="1"/></svg>
            <span>今日热点事件</span>
          </button>
        </div>
        <div class="nav-group">
          <button class="nav-item" data-view="weekend">
            <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/><path d="M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01"/></svg>
            <span>周末发酵</span>
          </button>
        </div>
      </nav>

      <div class="side-foot">
        <div class="dateline">
          <span class="updated" id="updated" aria-live="polite">—</span>
        </div>
      </div>
    </aside>

    <!-- 遮罩(移动端点侧栏外关闭) -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <!-- ===== 右侧展示区 ===== -->
    <main class="content-area" id="mainContent" tabindex="-1">
      <!-- 顶部状态栏 -->
      <div class="status-bar" id="statusBar">
        <div class="sb-left">
          <span class="sb-brand">盘面研判</span>
          <span class="sb-sep">·</span>
          <span class="sb-dim">Research desk</span>
        </div>
        <div class="sb-mid">
          <span class="sb-dim" id="sbDateTime">—</span>
          <span class="sb-market" id="sbMarket">● —</span>
        </div>
        <div class="global-search" id="globalSearch" role="search">
          <svg class="gs-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="globalSearchInput" type="search" autocomplete="off" placeholder="代码 / 名称 / 题材 / 新闻" aria-label="全局搜索" role="combobox" aria-autocomplete="list" aria-controls="searchPanel" aria-expanded="false" />
          <div class="search-panel" id="searchPanel" role="listbox" aria-label="搜索结果" aria-hidden="true"></div>
          <div class="sr-only" id="searchStatus" role="status" aria-live="polite"></div>
        </div>
        <div class="sb-data" id="sbData"></div>
      </div>

      <div class="content-in">

        <!-- Home 首页总览 -->
        <section class="view view-home home-only" id="viewHome"></section>

        <!-- 市场扫描 -->
        <section class="view market-only" id="viewMarket"></section>

        <!-- 逻辑链 -->
        <section class="view logic-only" id="viewLogic"></section>

        <!-- 周末发酵 -->
        <section class="view weekend-only" id="viewWeekend"></section>

        <!-- 今日热点事件 -->
        <section class="view events-only" id="viewEvents"></section>

        <!-- 外围热点（海外 AI + 市场，每 2 小时推送） -->
        <section class="view xbrief-only" id="viewXbrief"></section>

        <!-- 巨头核心(原 watch) -->
        <section class="view watch-only">
          <div class="wrap-tight">
            <section class="market-bar">
              <div class="mb-indices" id="marketSnap"></div>
              <div class="mb-gauges" id="marketGauges"></div>
              <div class="mb-stat" id="signalStat"></div>
            </section>
          </div>
          <div class="wrap-tight board">
            <aside class="rail watch-overview" aria-label="巨头核心概览与板块筛选">
              <section class="rail-block watch-summary"><h2 class="rail-h">盘面速览 <span class="rail-en">At a glance</span></h2><div class="stats" id="stats"></div></section>
              <section class="rail-block watch-sectors"><h2 class="rail-h">板块筛选 <span class="rail-en">Sectors</span></h2><div class="filter-group sector-list" id="sectorChips"></div></section>
            </aside>
            <div class="main-col">
              <nav class="filters">
                <div class="filters-in">
                  <div class="filter-group verdicts">
                    <button class="chip verdict-chip v-opp" data-verdict="opportunity">今日买点</button>
                    <button class="chip verdict-chip v-dd" data-verdict="drawdown">跌超25%</button>
                    <button class="chip verdict-chip" data-verdict="all">全部结论</button>
                    <button class="chip verdict-chip v-ok" data-verdict="成立">成立</button>
                    <button class="chip verdict-chip v-warn" data-verdict="存疑">存疑</button>
                    <button class="chip verdict-chip v-bad" data-verdict="证伪">证伪</button>
                    <button class="chip verdict-chip v-change" data-verdict="changed">叙事有变化</button>
                    <label class="sort-box">排序
                      <select id="sort">
                        <option value="default">默认(板块)</option>
                        <option value="chg">今日涨幅 ↓</option>
                        <option value="toBreakout">距突破 ↑(右侧近)</option>
                        <option value="pullback">回踩距离 ↑(左侧近)</option>
                        <option value="drawdown">距高点回撤 ↓(跌得多)</option>
                        <option value="trend">趋势强度 ↓</option>
                      </select>
                    </label>
                  </div>
                </div>
              </nav>
              <main class="grid" id="grid"></main>
            </div>
          </div>
        </section>

        <footer class="foot">
          <div class="wrap-tight foot-in">
            <span id="count">—</span>
            <span class="disclaimer">本看板数据自动整理/测算，仅供研究参考，<b>不构成任何投资建议</b>。投资有风险，决策需独立判断。</span>
            <span class="font-credit">界面字体 · 系统字体</span>
          </div>
        </footer>
      </div>
      <!-- 底部命令栏 -->
      <div class="bottom-bar">
        <span class="bb-brand">DATA</span>
        <span class="bb-src">东财·同花顺·通达信·巨潮</span>
        <span class="bb-sep">|</span>
        <span class="bb-dim" id="bbClock">—</span>
        <div class="bb-flex"></div>
        <span class="bb-hint">[/] 搜索 · [ENTER] 打开首个结果 · [ESC] 关闭 · 仅供研究，不构成投资建议</span>
      </div>
    </main>
  </div>

  <!-- 详情抽屉 -->
  <div class="drawer-backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true" tabindex="-1">
    <div class="drawer-inner" id="drawerInner"></div>
  </aside>

  <!-- 手机底部导航(≤980px 显示,桌面端隐藏) -->
  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="nav-item tab-item" data-view="home" aria-label="首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
      <span>首页</span>
    </button>
    <button class="nav-item tab-item" data-view="watch" aria-label="巨头核心">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
      <span>巨头</span>
    </button>
    <button class="tab-item tab-more" id="tabMore" aria-label="更多模块" aria-haspopup="true" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      <span>更多</span>
    </button>
  </nav>

  <script src="data.js?v=5" onerror="window.STOCKS=null" defer></script>
  <script src="meta.js?v=5" defer></script>
  <script src="market.js?v=5" defer></script>
  <script src="weekend.js?v=5" onerror="window.WEEKEND=null" defer></script>

  <script src="logic.js?v=5" onerror="window.LOGIC=null" defer></script>
  <script src="events.js?v=5" onerror="window.EVENTS=null" defer></script>
  <script src="xbriefs.js?v=1" onerror="window.XBRIEFS=null" defer></script>
  <script src="app.js?v=21" defer></script>
  <script src="app_ai_modules.js?v=6" defer></script>
</body>
</html>
